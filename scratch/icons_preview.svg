<svg width="400" height="100" viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg" style="background:#0A0D12">
  <!-- 1. Red 10-pointed star / thorn -->
  <g transform="translate(30, 25)">
    <path d="M 25.00,2.50 L 28.35,14.90 L 38.48,6.88 L 33.77,18.83 L 46.58,18.15 L 35.83,25.00 L 46.58,31.85 L 33.77,31.17 L 38.48,43.12 L 28.35,35.10 L 25.00,47.50 L 21.65,35.10 L 11.52,43.12 L 16.23,31.17 L 3.42,31.85 L 14.17,25.00 L 3.42,18.15 L 16.23,18.83 L 11.52,6.88 L 21.65,14.90 Z" fill="#EF4444" stroke="#EF4444" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="25" y="65" fill="#EF4444" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="700">Red Star</text>
  </g>

  <!-- 2. Green cloudy heart -->
  <g transform="translate(130, 25)">
    <!-- Organic puffy cloud heart -->
    <path d="M 25 45 C 23 43 9 32 5.5 24 C 2.5 17 5 9.5 12 8.5 C 17 7.5 22 10 25 14 C 28 10 33 7.5 38 8.5 C 45 9.5 47.5 17 44.5 24 C 41 32 27 43 25 45 Z" fill="#10B981"/>
    <!-- Puffy cloud lobes for cloud heart feel -->
    <circle cx="14" cy="14" r="6" fill="#10B981"/>
    <circle cx="21" cy="11" r="5" fill="#10B981"/>
    <circle cx="29" cy="11" r="5" fill="#10B981"/>
    <circle cx="36" cy="14" r="6" fill="#10B981"/>
    <circle cx="39" cy="22" r="5.5" fill="#10B981"/>
    <circle cx="11" cy="22" r="5.5" fill="#10B981"/>
    <text x="25" y="65" fill="#10B981" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="700">Green Cloud Heart</text>
  </g>

  <!-- 3. Yellow cloudy lightning / charge -->
  <g transform="translate(230, 25)">
    <path d="M 28 3 C 29.5 3 30.8 4.2 30.5 5.7 L 28.2 15.5 H 39 C 40.5 15.5 41.5 17 40.8 18.4 L 22.8 44.5 C 21.6 46.2 19.3 45.1 19.7 43.2 L 22.6 30.5 H 11.5 C 10 30.5 9.1 28.8 9.8 27.4 L 25.2 3.8 C 25.8 3.3 26.9 3 28 3 Z" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="25" y="65" fill="#F59E0B" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="700">Yellow Charge</text>
  </g>

  <!-- 4. Blue cloudy ring -->
  <g transform="translate(330, 25)">
    <!-- Outer puffy cloud lobes with inner cutout -->
    <path fill-rule="evenodd" d="M 25 5 C 31 5 36.5 8 40 13 C 46 14 50 19 50 25 C 50 31 46 36 40 37 C 36.5 42 31 45 25 45 C 19 45 13.5 42 10 37 C 4 36 0 31 0 25 C 0 19 4 14 10 13 C 13.5 8 19 5 25 5 Z M 25 16 C 20 16 16 20 16 25 C 16 30 20 34 25 34 C 30 34 34 30 34 25 C 34 20 30 16 25 16 Z" fill="#3B82F6"/>
    <text x="25" y="65" fill="#3B82F6" font-size="11" font-family="sans-serif" text-anchor="middle" font-weight="700">Blue Cloud Ring</text>
  </g>
</svg>